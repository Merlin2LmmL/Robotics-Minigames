<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
  }

  #stage {
    position: relative;
    margin-left: 20px;
    background: white;
    line-height: 0;
  }

  canvas {
    display: block;
    width: 960px;
    height: auto;
    border: 1px solid black;
  }

  #stage:fullscreen {
    margin: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
  }

  #stage:fullscreen canvas {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    border: 0;
  }

  #fs-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 36px;
    height: 36px;
    padding: 6px;
    background: white;
    border: 1px solid black;
    cursor: pointer;
    z-index: 10;
  }

  #fs-btn svg { display: block; }

  #fs-btn .icon-minimize { display: none; }
  #stage:fullscreen #fs-btn .icon-maximize { display: none; }
  #stage:fullscreen #fs-btn .icon-minimize { display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="board" width="1400" height="1550"></canvas>

  <button id="fs-btn" type="button" title="Fullscreen" aria-label="Fullscreen">
    <svg class="icon-maximize" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
    </svg>
    <svg class="icon-minimize" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
    </svg>
  </button>
</div>

<script>
  const stage = document.getElementById("stage");
  const btn = document.getElementById("fs-btn");

  btn.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen();
  });

  document.addEventListener("fullscreenchange", () => {
    const full = document.fullscreenElement === stage;
    const label = full ? "Exit fullscreen" : "Fullscreen";
    btn.title = label;
    btn.setAttribute("aria-label", label);
  });
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
